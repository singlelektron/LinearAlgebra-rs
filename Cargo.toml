[package]
name = "linearalgebra-rs"
version = "0.1.0"
edition = "2024"
description = "An exact-first linear algebra expression workbench for the terminal"

[lib]
name = "linearalgebra"
path = "src/lib.rs"

[[bin]]
name = "la"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
